name: Publish to PyPI
on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  build-and-publish:
    # Never ship a tag that doesn't pass CI.
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Assert the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+[^"]*"' src/fabric_capacity_monitor/__init__.py | tr -d '"')
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $pkg"
            exit 1
          fi
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
